<div class="container">
  <h2>Faça o login</h2>
  <div class="form-group">
    <label for="username">Usuário</label>
    <input type="text" [(ngModel)]="username" class="form-control" id="username" placeholder="Digite o usuario">
  </div>
  <div class="form-group">
    <label for="password">Senha</label>
    <input type="password" [(ngModel)]="password" class="form-control" id="password" placeholder="Digite a senha">
  </div>
  <button (click)="login()" class="btn btn-primary">Entrar</button>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
</div>
